openapi: 3.0.3
info:
  title: Contrato de Datos — Venta de Computadoras
  version: 1.0.0
  description: Especificación académica; no hay servidor HTTP implementado ni URL
    de despliegue. Persistencia PostgreSQL. Ver endpoints.md para autorización, consultas
    parametrizadas y errores.
