<text x="1228" y="1165" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#253650">           precio_unitario</text>
<text x="1228" y="1197" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#253650">G         subtotal</text>
<text x="50" y="1370" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#253650">FK → destino: categorías y marcas → productos; productos y proveedores → tabla puente.</text>
<text x="50" y="1408" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#253650">Clientes → ventas; ventas y productos → detalle. Todas las FK usan ON DELETE RESTRICT.</text>
<text x="50" y="1446" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#62728B">UQ* = UNIQUE(tipo_documento, numero_documento). Las dos PK dobles son compuestas.</text>
<text x="50" y="1484" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#62728B">Subtotal = cantidad × precio_unitario. El total de venta se deriva en v_ventas_resumen.</text>
<text x="50" y="1540" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#62728B">Un producto representa una configuración de computadora; sus existencias se controlan por unidades.</text>
</svg>